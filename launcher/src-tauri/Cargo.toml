[package]
name = "campfire-launcher"
version.workspace = true
edition.workspace = true

[lib]
name = "campfire_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
campfire-launcher-core = { path = "../core" }
# "Game folder" and "Open log" (04-RESEARCH.md Standard Stack, Package
# Legitimacy Audit: OK/Approved) — reveals a path in the OS file manager;
# no tauri-plugin-shell anywhere in this project.
tauri-plugin-opener = "2"
