[package]
name = "campfire-launcher-core"
version.workspace = true
edition.workspace = true

[lib]
name = "campfire_launcher_core"
path = "src/lib.rs"

[[bin]]
name = "campfire-cli"
path = "src/bin/campfire-cli.rs"

[dependencies]
# rustls (not native-tls): a pure-Rust TLS stack with no per-OS system
# store dependency, needed so campfire_client() can disable built-in roots
# and public_client() can rely on reqwest's own bundled webpki roots —
# consistent behavior on Windows/macOS/Linux alike.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "time"] }
directories = "6"
# Manifest sha256 diff/verify — pure Rust, no OpenSSL cross-compile pain
# (04-RESEARCH.md Standard Stack, Package Legitimacy Audit: OK/Approved).
sha2 = "0.10"
# Bounded concurrent downloads (buffer_unordered) without spawning onto
# 'static tasks — already a locked transitive dependency of tokio/reqwest,
# promoted to a direct one for the manifest sync's 4-at-a-time download.
futures-util = "0.3"
# Per-segment percent-encoding of pack file URLs (spaces in real filenames)
# while leaving '/' separators alone — already a locked transitive
# dependency of `url`/reqwest, promoted to direct for the same reason.
percent-encoding = "2"
# Java archive extraction (04-RESEARCH.md Standard Stack, Package
# Legitimacy Audit: OK/Approved for both).
zip = "2"
flate2 = "1"
tar = "0.4"
# RESEARCH.md: pin ^3 (not the current 4.x) — v3's Entry::new/set_password/
# get_password surface is the only thing this crate needs, and 4.x's
# modifiers-map API reshuffle buys nothing for one call site. `linux-native`
# only (no secret-service feature): enabling secret-service alongside it
# would make keyring's *default* backend selection prefer secret-service,
# which has no daemon on this Pi (confirmed live) — linux-native's keyutils
# backend is what RESEARCH.md says makes the credential round trip a real,
# asserted test here.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# sysctlbyname("sysctl.proc_translated") for Rosetta detection — macOS only,
# so no other platform pays for it (04-RESEARCH.md Pattern 3).
libc = "0.2"

[dev-dependencies]
