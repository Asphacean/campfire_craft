# RESEARCH.md Pitfall 3: ForgeGradle 2.3's setupDecompWorkspace/decompile task
# is reported across multiple independent issue threads to need 3GB+ of heap.
org.gradle.jvmargs=-Xmx3G

# A resident daemon on a Pi that is also running a 6GB game server is
# unwanted background memory pressure between builds.
org.gradle.daemon=false
