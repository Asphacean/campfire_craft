name: Release
# D-04/D-05: builds Windows x64 + both macOS bundles on every `v*` tag,
# publishes a GitHub Release, then a self-hosted job on the operator's own
# Pi re-signs the release assets with the real, pi-only minisign key and
# writes the live update feed. No fork-triggerable event exists anywhere
# in this file (T-05-04): only a tag push can start this workflow, and
# only an account with write access can push a tag.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-14
          - platform: macos-15-intel # the current Intel label (RESEARCH Pitfall 2 — the prior Ventura label was retired Dec 2025)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.0'

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: launcher -> target

      - name: Install tauri-cli 2.11.4 (locked)
        run: cargo install tauri-cli --version 2.11.4 --locked

      # The one correction this plan makes to a locked decision (see
      # 05-01-PLAN.md objective): --no-sign would also switch off the
      # ad-hoc macOS codesign D-08 requires, so instead a throwaway
      # updater keypair is generated inside the run, satisfies the
      # build-time pubkey gate, and is destroyed with the runner. The
      # real pi-only signing key that lives outside this repo is never referenced here.
      - name: Generate throwaway updater signing key (never uploaded, dies with the runner)
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/throwaway-updater.key"
          cargo tauri signer generate --ci -w "$KEY_PATH" -p ""
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tauriScript: cargo-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Campfire Launcher ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      # CR-01: a GitHub Release asset is mutable after upload by anyone with
      # release-edit permission, so the publish job below can't trust "matches
      # this filename on this tag" as proof the bytes are what this build just
      # produced. Record a build-time checksum as a workflow-run ARTIFACT
      # instead (immutable once uploaded, unlike a release asset) so publish
      # can verify before it signs anything with the real pi-only key.
      - name: "Record artifact checksums (CR-01 signing-oracle guard)"
        shell: bash
        run: |
          set -euo pipefail
          find launcher/target/release/bundle -type f \
            \( -name '*_x64-setup.exe' -o -name '*_x64_en-US.msi' \
               -o -name '*_aarch64.app.tar.gz' -o -name '*_x64.app.tar.gz' \
               -o -name '*.dmg' \) \
            -print0 \
            | xargs -0 --no-run-if-empty sha256sum \
            | sed -E 's|(  ).*/|\1|' > "checksums-${{ matrix.platform }}.txt"
          cat "checksums-${{ matrix.platform }}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-${{ matrix.platform }}
          path: checksums-${{ matrix.platform }}.txt
          retention-days: 1

  publish:
    needs: build
    runs-on: [self-hosted, campfire-publish]
    permissions:
      contents: read
    steps:
      # No checkout: publish-launcher.sh resolves its own repo root from
      # the operator's real working tree, which is where server.env, the
      # pi-only signing key and the Caddy-served launcher-dist/ actually
      # live — a runner-scratch checkout would have none of those.
      # CR-01: pull the build job's checksum artifacts (workflow-run
      # artifacts, immutable once uploaded — unlike the mutable Release
      # page below) so the verify step can prove the downloaded release
      # assets are the exact bytes the build job produced in this same run,
      # before anything gets signed with the real pi-only key.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true

      - name: Download release assets and publish the signed feed
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FATAL: tag '$TAG' is not v<major.minor.patch>" >&2
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          ASSET_URLS="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r '.assets[] | select(.name | test("_x64-setup\\.exe$|_aarch64\\.app\\.tar\\.gz$|_x64\\.app\\.tar\\.gz$")) | .browser_download_url')"

          if [ -z "$ASSET_URLS" ]; then
            echo "FATAL: no matching release assets found for tag $TAG" >&2
            exit 1
          fi

          cd "$WORKDIR"
          while IFS= read -r url; do
            curl -fsSL -O "$url"
          done <<< "$ASSET_URLS"

          # CR-01: refuse to sign anything until every downloaded asset's
          # sha256 matches what the build job recorded for it in this same
          # run. A GitHub Release asset can be swapped after upload by
          # anyone with release-edit rights; the checksums artifact
          # downloaded above cannot be, so it's the only thing this step
          # trusts as proof of provenance.
          CHECKSUMS_DIR="$GITHUB_WORKSPACE/checksums"
          for f in *; do
            grep -qF "  $f" "$CHECKSUMS_DIR"/*.txt || { echo "FATAL: no known-good checksum for $f -- refusing to sign" >&2; exit 1; }
          done
          sha256sum -c <(cat "$CHECKSUMS_DIR"/*.txt) --ignore-missing
          echo "Checksum verification passed for all downloaded assets."

          /home/asphacean/rlcraft/scripts/publish-launcher.sh \
            --version "$VERSION" \
            --notes "Release ${TAG}" \
            "$WORKDIR"/*
