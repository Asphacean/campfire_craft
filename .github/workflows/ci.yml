name: CI
# D-06: the every-push smoke gate. Runs on ubuntu-latest only — no
# OS-native bundling happens here, only the core crate (Tauri-free) plus
# auth-service, so the cheapest runner suffices. Deliberately no
# fork-triggerable event anywhere in this repo's workflows: a self-hosted
# runner exists in release.yml's publish job, and letting a fork's PR
# schedule anything here would be handing a stranger's code a path to
# that runner (T-05-04).
on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Full-history secret scan on every push (T-05-01) — the same
      # pinned gitleaks version and checksum-verification discipline as
      # the operator's own Task 1 install, linux_x64 this time for the
      # ubuntu-latest runner.
      - name: Install gitleaks v8.30.1 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Full-history secret scan (gitleaks)
        run: gitleaks detect --source . --log-opts=--all --redact --report-format json --report-path /tmp/gitleaks-ci.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.98.0'
          components: clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            launcher -> target
            auth-service -> target

      - name: cargo test (launcher core)
        run: cargo test -p campfire-launcher-core --manifest-path launcher/Cargo.toml

      - name: cargo clippy (launcher core)
        run: cargo clippy -p campfire-launcher-core --manifest-path launcher/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (auth-service)
        run: cargo test --manifest-path auth-service/Cargo.toml

      - name: Shell syntax check
        run: bash -n scripts/*.sh

      - name: Python syntax check
        run: python3 -m py_compile scripts/*.py
